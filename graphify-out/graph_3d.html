    };

    let autoRotate = true;
    const elem = document.getElementById('3d-graph');
    const Graph = ForceGraph3D()(elem)
      .graphData(gData)
      .nodeLabel(node => node.name + ' (' + (node.community_name || 'General') + ')')
      .nodeColor('color')
      .nodeVal('val')
      .nodeResolution(16)
      .linkDirectionalParticles(2)
      .linkDirectionalParticleWidth(1.4)
      .linkDirectionalParticleSpeed(0.005)
      .linkWidth(0.8)
      .linkOpacity(0.28)
      .backgroundColor('#060814')
      .onNodeClick(node => {
        const distance = 90;
        const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
        Graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node,
          2000
        );
        document.getElementById('info-card').style.display = 'block';
        document.getElementById('card-title').textContent = node.name;
        document.getElementById('card-comm').textContent = node.community_name + ' (Group ' + node.community + ')';
        document.getElementById('card-file').textContent = node.file || 'N/A';
        document.getElementById('card-type').textContent = node.type;
      });

    // Orbital camera auto-rotation
    let angle = 0;
    setInterval(() => {
      if (autoRotate) {
        Graph.cameraPosition({
          x: 500 * Math.sin(angle),
          z: 500 * Math.cos(angle)
        });
        angle += Math.PI / 1500;
      }
    }, 20);

    document.getElementById('btn-rotate').addEventListener('click', function() {
      autoRotate = !autoRotate;
      this.textContent = autoRotate ? 'Tạm Dừng Xoay' : 'Bật Tự Động Xoay';
      this.style.borderColor = autoRotate ? 'rgba(148, 163, 184, 0.3)' : '#22c55e';
      this.style.color = autoRotate ? '#e2e8f0' : '#22c55e';
    });

    document.getElementById('btn-reset').addEventListener('click', function() {
      Graph.cameraPosition({ x: 0, y: 0, z: 500 }, { x: 0, y: 0, z: 0 }, 1500);
    });
