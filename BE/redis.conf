# Redis AOF Persistence Config
# ============================
# File này hướng dẫn cách bật AOF (Append Only File) cho Redis — 
# đảm bảo hàng đợi BullMQ không mất job khi Redis bị restart.
#
# ÁP DỤNG theo 1 trong 2 cách:

## Cách 1: Chạy Redis Docker với flag AOF
# docker run -d \
#   --name logpulse-redis \
#   -p 6379:6379 \
#   -v redis_data:/data \
#   redis:7-alpine \
#   redis-server --appendonly yes --appendfsync everysec

## Cách 2: redis.conf (nếu dùng Redis cài trực tiếp trên máy)
# Thêm vào file redis.conf:
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

## Giải thích:
# - appendonly yes:        Bật AOF persistence
# - appendfsync everysec:  Sync mỗi giây (cân bằng hiệu năng vs an toàn)
# - appendfilename:        Tên file AOF lưu trên disk

## Kiểm tra AOF đã bật chưa:
# redis-cli CONFIG GET appendonly
# Kết quả mong đợi: ["appendonly", "yes"]
